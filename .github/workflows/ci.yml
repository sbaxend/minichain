name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (the backend has none)
        run: npm run explorer:install

      - name: Backend tests (node:test)
        run: npm test

      - name: Frontend tests (Vitest)
        run: npm run explorer:test

      - name: Frontend production build
        run: npm run explorer:build

      - name: Explorer self-check (3 local nodes + API + built UI)
        run: npm run demo:explorer -- --check --port 0
